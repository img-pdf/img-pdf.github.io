name: Validate & Generate Sitemaps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      submit_all:
        description: 'Submit all canonical URLs to IndexNow (true/false)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  sitemaps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Dual Sitemaps (XML & TXT)
        run: node scripts/generate-sitemaps.js

      - name: Validate Sitemaps & Robots.txt
        run: node scripts/validate-sitemaps.js

      - name: Verify Sitemap Match & Git Cleanliness
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain sitemap.xml Sitemap.xml sitemap.txt Sitemap.txt)" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Error: Sitemaps are out of date in this Pull Request. Please run 'npm run build:sitemap' locally and commit the changes."
              exit 1
            fi
            echo "Sitemaps changed after generation. Committing updates..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml Sitemap.xml sitemap.txt Sitemap.txt
            git commit -m "Auto-regenerate dual sitemaps (sitemap.xml and sitemap.txt) [skip ci]"
            git push origin HEAD:main
          else
            echo "Sitemaps are completely in sync with the codebase."
          fi

      - name: Submit Changed URLs to IndexNow
        if: github.event_name != 'pull_request'
        run: |
          if [ "${{ github.event.inputs.submit_all }}" = "true" ]; then
            node scripts/submit-indexnow.js --all
          else
            node scripts/submit-indexnow.js
          fi
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY || 'e5517a0fefdf3e347b1768a306cfb093' }}
